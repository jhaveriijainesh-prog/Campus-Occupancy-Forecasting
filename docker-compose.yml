services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bds06-campus-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DEBUG=${DEBUG:-true}
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DATA_DIR=/app/data
      - MODELS_DIR=/app/models
      - LOGS_DIR=/app/logs
      - CONFIGS_DIR=/app/configs
      - SOLVER_TIMEOUT_SECONDS=30
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./experiments:/app/experiments
      - ./logs:/app/logs
      - ./configs:/app/configs
    networks:
      - campus-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bds06-campus-dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    command: ["streamlit", "run", "app/dashboard/app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    env_file:
      - .env
    environment:
      - FASTAPI_INTERNAL_URL=${FASTAPI_INTERNAL_URL:-http://api:8000}
      - FASTAPI_PUBLIC_URL=${FASTAPI_PUBLIC_URL:-http://localhost:8000}
      - DATA_DIR=/app/data
      - MODELS_DIR=/app/models
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
    depends_on:
      api:
        condition: service_healthy
    networks:
      - campus-network

networks:
  campus-network:
    driver: bridge
